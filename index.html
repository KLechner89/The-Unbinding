<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header class="topbar">
  <span class="wordmark label">Kyle Lechner</span>
</header>
<nav class="site-menu" id="siteMenu" aria-label="Site menu">
  <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel"><span></span><span></span><span></span></button>
  <div class="menu-panel" id="menuPanel">
    <button type="button" class="menu-item" onclick="openMailer()">Stay notified</button>
    <a class="menu-item" href="/book.html">Schedule a meeting</a>
  </div>
</nav>
<div class="mailer-overlay" id="mailerOverlay">
  <button class="mailer-close" onclick="toggleMailer()" aria-label="Close">✕</button>
  <div id="mailerForm">
    <div class="mailer-heading">New work is coming.</div>
    <div class="mailer-sub">Get notified when it's published. Nothing else.</div>
    <form name="mailing-list" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="submitMailer(event)">
      <input type="hidden" name="bot-field">
      <input type="text" name="name" class="mailer-input" placeholder="Your name" aria-label="Your name" style="margin-bottom:12px">
      <input type="email" name="email" class="mailer-input" placeholder="Your email" aria-label="Your email" required>
      <button type="submit" class="mailer-submit">Notify me</button>
    </form>
  </div>
  <div class="mailer-success" id="mailerSuccess">
    <h3>Noted.</h3>
  </div>
</div>
<main class="home">
  <h1 class="sr-only">Kyle Lechner</h1>
  <ul class="words">
    <li><a href="/fiction/"><span class="word">Fiction</span><span class="num fiction">01</span></a></li>
    <li><a href="/essays/"><span class="word">Essays</span><span class="num essays">02</span></a></li>
    <li><a href="/media/"><span class="word">Media</span><span class="num media">03</span></a></li>
  </ul>
</main>
<script src="/assets/menu.js"></script>
